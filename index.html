
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="John Gluck - Art, experiments, and creative tools.">
  <title>John Gluck | johngluck.art</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   sans-serif;
      background: #f7f6f2;
      color: #292929;
      line-height: 1.6;
    }

    header {
      padding: 70px 24px 45px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 3rem;
      font-weight: 600;
      letter-spacing: -2px;
    }

    header p {
      color: #777;
      font-size: 1.1rem;
      margin-top: 8px;
    }

    main {
      max-width: 850px;
      margin: 0 auto;
      padding: 20px 24px 80px;
    }

    section {
      margin-top: 35px;
    }

    h2 {
      font-size: 1.5rem;
      font-weight: 600;
      border-bottom: 1px solid #ddd;
      padding-bottom: 10px;
    }

    .generator-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-top: 22px;
    }

    .generator {
      display: block;
      padding: 22px;
      background: #fff;
      border: 1px solid #e5e3dd;
      border-radius: 10px;
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .generator:hover {
      transform: translateY(-3px);
      box-shadow: 0 5px 18px rgba(0,0,0,0.08);
    }

    .generator h3 {
      margin: 0 0 8px;
      font-size: 1.15rem;
    }

    .generator p {
      margin: 0;
      color: #777;
      font-size: 0.95rem;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #999;
      font-size: 0.85rem;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 2.3rem;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>John Gluck</h1>
    <p>Art, experiments, and things I've made.</p>
  </header>

  <main>

    <section>
      <h2>Generators</h2>

      <div class="generator-list">

        <a class="generator" href="/generators/generator1.html">
          <h3>Generator One</h3>
          <p>Description of your first generator.</p>
        </a>

        <a class="generator" href="/generators/generator2.html">
          <h3>Generator Two</h3>
          <p>Description of your second generator.</p>
        </a>

        <a class="generator" href="/generators/generator3.html">
          <h3>Generator Three</h3>
          <p>Description of your third generator.</p>
        </a>

      </div>
    </section>

  </main>

  <footer>
    © 2026 John Gluck
  </footer>

</body>
</html>
